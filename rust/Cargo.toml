[package]
name = "clipin-core"
# 与发布版本对齐（project.yml MARKETING_VERSION / git tag）；落后会让崩溃日志里的
# crate 版本与实际 app 版本对不上，排查时误导。
version = "0.1.19"
edition = "2024"

[lib]
crate-type = ["staticlib"]
name = "clipin_core"

[dependencies]
uniffi = { version = "0.29", features = ["cli"] }
rusqlite = { version = "0.33", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
pinyin = "0.10"
chrono = "0.4"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
