name: CI

on:
  pull_request:
  push:
    # 改成所有 branch 兜底：历史上只跟 main，feature branch push 不触发，
    # PR 触发也长期未生效（见 PR#3 review 期间排查）。
    # release tag push 默认不在 branches 范围内，不会重复跑。
    branches:
      - '**'

jobs:
  # Rust 依赖供应链审计。独立 job：advisory 库随时更新，新漏洞会让无关 PR 变红——
  # 拆开后它给独立信号，不污染"代码能否编译/测试通过"的主信号，又不架空门禁。
  # 跑在 ubuntu 上（纯 cargo 审计，无需 macOS runner，更省更快）。
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rust

  test:
    # macos-latest 当前仍指向 macOS 15，不带 macOS 26 SDK——而 Clipin 用到
    # NSGlassEffectView / .glass buttonStyle 等 Tahoe (macOS 26) 新 API，
    # 在老 SDK 上根本符号缺失。v0.1.7 CI 红就是这个原因。
    # 用 macos-26（不带 -arm64）：GitHub macOS runner 自 14 起默认就是
    # Apple Silicon，alias 标签调度池更宽，比 -arm64 排队短。
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 锁到 Xcode 26.4.1（与本地 macOS 26.4.1 同档），避免 runner 默认 26.2 漏掉
      # 26.3+ 引入的 AppKit 符号（NSGlassEffectView / .glass 在 26.0+，理论上 26.2
      # 已足够，但显式锁定避免未来 GitHub 升 default 时再次出现版本错配）。
      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Install Rust target
        run: rustup target add aarch64-apple-darwin

      - name: Rust tests
        run: |
          RUSTC="$(rustup which rustc)" rustup run stable cargo test --manifest-path rust/Cargo.toml --lib

      # 预提交守卫只挂在 Xcode preBuildScripts 上，绕过 Xcode 的 PR 路径（脚本/CI-only
      # 改动）不会被校验。CI 显式跑一遍，间距/本地化回归在合并前必中。
      - name: Spacing & localization guards
        run: |
          bash scripts/check-spacing-tokens.sh
          bash scripts/check-localization.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: macOS arm64 build
        # 必须显式 arch=arm64：generic/platform=macOS 会让链接阶段隐式带上 x86_64，
        # 而 build-rust.sh 只产 aarch64-apple-darwin 静态库，x86_64 链接缺 UniFFI 符号。
        # （CLAUDE.md「只发 Apple Silicon / arm64」红线；test 步骤也用同款 destination）
        run: |
          xcodebuild \
            -project Clipin.xcodeproj \
            -scheme Clipin \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Swift unit tests
        run: |
          xcodebuild \
            -project Clipin.xcodeproj \
            -scheme Clipin \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            test
